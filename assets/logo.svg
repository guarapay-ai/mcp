  <path d="M58 112 Q80 122 102 112 L106 140 L54 140 Z" fill="#D9480F"/>
  <path d="M66 118 Q80 128 94 118 L92 140 L68 140 Z" fill="#FFF3E2"/>
  <!-- cream cheeks and throat -->
  <path d="M46 96 Q58 100 64 116 Q52 112 46 96 Z" fill="#FFF3E2"/>
  <path d="M114 96 Q102 100 96 116 Q108 112 114 96 Z" fill="#FFF3E2"/>
  <!-- long dark muzzle -->
  <path d="M71 86 Q80 80 89 86 Q89 104 85 116 Q80 122 75 116 Q71 104 71 86 Z" fill="#221812"/>
  <path d="M80 80 Q83 88 80 98 Q77 88 80 80 Z" fill="#3A2A20"/>
  <!-- nose + smile -->
  <ellipse cx="80" cy="115" rx="7" ry="5" fill="#050302"/>
  <ellipse cx="77.5" cy="113.2" rx="2.3" ry="1.2" fill="#fff" opacity=".7"/>
  <path d="M73 123 Q80 128 87 123" fill="none" stroke="#050302" stroke-width="2.4" stroke-linecap="round"/>
  <!-- eyes -->
  <path d="M50 80 Q60 68 70 80 Q60 86 50 80 Z" fill="#fff"/>
  <path d="M110 80 Q100 68 90 80 Q100 86 110 80 Z" fill="#fff"/>
  <circle cx="61" cy="78.5" r="5.2" fill="url(#iris)"/>
  <circle cx="99" cy="78.5" r="5.2" fill="url(#iris)"/>
  <circle cx="61.5" cy="79" r="2.6" fill="#120B07"/>
  <circle cx="99.5" cy="79" r="2.6" fill="#120B07"/>
  <circle cx="63" cy="77" r="1.3" fill="#fff"/>
  <circle cx="101" cy="77" r="1.3" fill="#fff"/>
  <path d="M50 70 Q60 64 70 70" fill="none" stroke="#7C2D12" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M110 70 Q100 64 90 70" fill="none" stroke="#7C2D12" stroke-width="2.6" stroke-linecap="round"/>
  <!-- fan scarf -->
  <path d="M46 128 Q80 142 114 128 L118 144 Q80 160 42 144 Z" fill="#2BE38A"/>
  <path d="M58 133 L56 149 M72 136 L71 152 M88 136 L89 152 M102 133 L104 149" stroke="#FFD43B" stroke-width="5"/>
  <path d="M98 146 L106 160 L92 160 Z" fill="#1FC877"/><path d="M108 144 L120 158 L106 160 Z" fill="#2BE38A"/>
