<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Lobo-guara">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F58A3C"/><stop offset="1" stop-color="#D9480F"/>
    </linearGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C2D12"/><stop offset=".35" stop-color="#C2410C"/><stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="iris" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#E8A317"/>
    </radialGradient>
  </defs>
  <!-- mane: soft dark tufts behind the neck -->
  <path d="M44 132 Q40 112 52 104 Q56 96 64 100 Q70 90 80 96 Q90 90 96 100 Q104 96 108 104 Q120 112 116 132 Z" fill="#17110D"/>
  <!-- ears -->
  <path d="M50 74 L26 14 Q27 4 37 8 L74 50 Z" fill="url(#ear)"/>
  <path d="M110 74 L134 14 Q133 4 123 8 L86 50 Z" fill="url(#ear)"/>
  <path d="M52 64 L34 20 Q36 16 40 18 L68 50 Z" fill="#FFF3E2"/>
  <path d="M108 64 L126 20 Q124 16 120 18 L92 50 Z" fill="#FFF3E2"/>
  <path d="M44 44 l6 -2 -2 6 6 -1 -3 6" fill="none" stroke="#F3D9BC" stroke-width="2" stroke-linecap="round"/>
  <path d="M116 44 l-6 -2 2 6 -6 -1 3 6" fill="none" stroke="#F3D9BC" stroke-width="2" stroke-linecap="round"/>
  <!-- head with cheek fluff -->
  <path d="M34 78 Q38 44 80 40 Q122 44 126 78 L132 86 L122 90 L126 98 L112 100 Q100 106 92 120 L68 120 Q60 106 48 100 L34 98 L38 90 L28 86 Z" fill="url(#fur)"/>
